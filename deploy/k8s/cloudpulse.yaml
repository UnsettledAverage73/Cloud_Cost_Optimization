apiVersion: v1
kind: Namespace
metadata:
  name: cloudpulse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpulse-config
  namespace: cloudpulse
data:
  ENVIRONMENT: "production"
  PORT: "8000"
  FOCUS_VERSION: "1.0"
  ENABLE_SEMANTIC_RAG: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-backend
  namespace: cloudpulse
  labels:
    app: cloudpulse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudpulse-backend
  template:
    metadata:
      labels:
        app: cloudpulse-backend
    spec:
      containers:
      - name: backend
        image: cloudpulse/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: cloudpulse-config
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /api/v2/copilot/capabilities
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v2/copilot/capabilities
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-backend-service
  namespace: cloudpulse
spec:
  type: ClusterIP
  selector:
    app: cloudpulse-backend
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudpulse-backend-hpa
  namespace: cloudpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudpulse-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
