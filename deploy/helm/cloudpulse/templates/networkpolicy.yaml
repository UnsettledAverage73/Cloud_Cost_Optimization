{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloudpulse.fullname" . }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudpulse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.allowEgressAws }}
    # Allow HTTPS to AWS APIs, GitHub, and Webhook dispatchers
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
