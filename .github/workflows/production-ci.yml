name: CloudPulse Enterprise Production CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # =====================================================================
  # 🐍 BACKEND CI: Tests, Health Probes & SRE Invariants
  # =====================================================================
  backend-test:
    name: Backend Pytest & SRE Probes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Full Backend Test Suite
        env:
          PYTHONPATH: backend
          RATE_LIMIT_ENABLED: "false"
          GROQ_API_KEY: "gsk_mock_production_ci_pipeline"
        run: |
          pytest backend/tests/ -v --durations=10

  # =====================================================================
  # ⚛️ FRONTEND CI: Vitest, TypeScript & Next.js Turbopack Build
  # =====================================================================
  frontend-test:
    name: Frontend Vitest & Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Vitest Unit & E2E Tests
        working-directory: ./frontend
        run: pnpm test -- --run

      - name: Compile Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
        run: pnpm build

  # =====================================================================
  # ☸️ KUBERNETES & HELM VALIDATION
  # =====================================================================
  helm-validation:
    name: Helm Chart & Kubernetes Linting
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint CloudPulse Helm Chart
        run: |
          helm lint deploy/helm/cloudpulse

      - name: Validate Helm Template Rendering
        run: |
          helm template cloudpulse-release deploy/helm/cloudpulse --debug > /dev/null
          echo "✅ Helm template rendered cleanly with zero schema errors."

  # =====================================================================
  # 🐳 DOCKER CONTAINER BUILD VERIFICATION
  # =====================================================================
  docker-build:
    name: Production Multi-Stage Docker Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cloudpulse/backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: cloudpulse/frontend:ci-test
